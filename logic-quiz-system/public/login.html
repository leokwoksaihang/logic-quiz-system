<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Quiz System — Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.logo { text-align: center; margin-bottom: 32px; }
.logo .icon { font-size: 3rem; margin-bottom: 8px; }
.logo h1 { font-size: 1.5rem; color: #1a1a2e; }
.logo p  { color: #888; font-size: .9rem; margin-top: 4px; }
label { display: block; font-size: .85rem; font-weight: 600; color: #555; margin-bottom: 6px; }
input {
  width: 100%; padding: 12px 16px;
  border: 2px solid #e5e7eb; border-radius: 10px;
  font-size: 1rem; outline: none; transition: border-color .2s;
  margin-bottom: 20px;
}
input:focus { border-color: #6c63ff; }
button {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #6c63ff, #5a52d5);
  color: white; border: none; border-radius: 10px;
  font-size: 1rem; font-weight: 600; cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,99,255,.35); }
button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.error {
  background: #fef2f2; border: 1px solid #fecaca;
  color: #991b1b; padding: 12px 16px; border-radius: 8px;
  font-size: .88rem; margin-bottom: 16px; display: none;
}
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { text-align: center; color: #aaa; font-size: .78rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🧠</div>
    <h1>Logic Quiz System</h1>
    <p>Sign in to continue</p>
  </div>
  <div id="error" class="error"></div>
  <label for="username">Username</label>
  <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
  <button id="btn" onclick="doLogin()">Sign In</button>
  <p class="note">Contact your instructor if you have not received login credentials.</p>
</div>

<script>
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('error');

  if (!username || !password) { showError('Please enter your username and password.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';
  errEl.style.display = 'none';

  try {
    const res  = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'Login failed.'); return; }

    localStorage.setItem('lqs_token', data.token);
    localStorage.setItem('lqs_user',  JSON.stringify(data.user));

    if (data.user.role === 'instructor') {
      window.location.href = '/instructor';
    } else {
      window.location.href = '/student';
    }
  } catch (e) {
    showError('Cannot connect to server. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
