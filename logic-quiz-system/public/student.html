<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Quiz — Student</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #6c63ff;
  --dark: #1a1a2e;
  --card: white;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: var(--text); }
header {
  background: var(--dark);
  color: white;
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
}
header h1 { font-size: 1.1rem; }
#timer {
  background: rgba(255,255,255,.12);
  border-radius: 8px; padding: 7px 18px;
  font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
#timer.warn { background: #dc2626; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.6} }
.btn {
  padding: 10px 22px; border: none; border-radius: 8px;
  font-size: .9rem; font-weight: 600; cursor: pointer; transition: all .15s;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #5a52d5; }
.btn-secondary { background: #f3f4f6; color: #374151; }
.btn-secondary:hover { background: #e5e7eb; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── WAITING SCREEN ── */
#waiting {
  max-width: 500px; margin: 80px auto; text-align: center;
  background: white; border-radius: 16px; padding: 48px 36px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
}
#waiting .big { font-size: 3rem; margin-bottom: 16px; }
#waiting h2 { font-size: 1.5rem; margin-bottom: 8px; }
#waiting p  { color: var(--muted); line-height: 1.6; }

/* ── QUIZ LAYOUT ── */
#quiz { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
.q-nav {
  background: white; border-radius: 12px; padding: 16px 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,.05); margin-bottom: 20px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.q-dot {
  width: 34px; height: 34px; border-radius: 8px;
  background: #f3f4f6; border: 2px solid transparent;
  font-size: .8rem; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.q-dot.answered { background: #ddd6fe; color: #5b21b6; }
.q-dot.active   { border-color: var(--primary); }

.progress-wrap { background: #e5e7eb; border-radius: 99px; height: 6px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s; }

.question-card {
  background: white; border-radius: 16px; padding: 32px 28px;
  box-shadow: 0 2px 16px rgba(0,0,0,.06); margin-bottom: 16px;
}
.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.q-num { font-size: .85rem; color: var(--muted); font-weight: 600; }
.q-type { padding: 3px 12px; border-radius: 99px; font-size: .75rem; font-weight: 700; text-transform: uppercase; }
.type-tt   { background: #dbeafe; color: #1d4ed8; }
.type-nd   { background: #dcfce7; color: #166534; }
.type-pl   { background: #fae8ff; color: #7e22ce; }
.type-tr   { background: #fef9c3; color: #854d0e; }
.q-text { font-size: 1.05rem; font-weight: 600; line-height: 1.6; margin-bottom: 24px; }

/* ── SYMBOL BAR ── */
.sym-bar {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 12px; padding: 10px 12px;
  background: #f9fafb; border-radius: 8px; border: 1px solid var(--border);
}
.sym-btn {
  padding: 5px 12px; font-size: .9rem; font-family: 'Courier New', monospace;
  border: 1.5px solid #d1d5db; border-radius: 6px; background: white;
  cursor: pointer; transition: all .15s; font-weight: 600;
}
.sym-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

/* ── TRUTH TABLE ── */
.tt-table { border-collapse: collapse; width: 100%; font-size: .9rem; margin-bottom: 12px; }
.tt-table th, .tt-table td {
  border: 1px solid #d1d5db; padding: 0; text-align: center; min-width: 56px;
}
.tt-table th { background: #f3f4f6; padding: 8px 4px; font-weight: 700; font-family: monospace; }
.tt-table td input {
  width: 100%; min-width: 56px; height: 36px; border: none; text-align: center;
  font-size: .9rem; font-family: monospace; font-weight: 600; outline: none;
  background: transparent; text-transform: uppercase;
}
.tt-table td input:focus { background: #eff6ff; }
.tt-table .given-col { background: #f9fafb; }
.tt-table .given-col input { color: #6b7280; }
.shortcut-table { border-collapse: collapse; }
.shortcut-table td { border: 1px solid #d1d5db; padding: 0; }
.shortcut-table td input { width: 40px; height: 36px; border: none; text-align: center; font-family: monospace; font-weight: 600; outline: none; }
.shortcut-table .row-label { padding: 4px 8px; background: #f3f4f6; font-size: .8rem; font-weight: 700; white-space: nowrap; }

/* ── ND TABLE ── */
.nd-wrap { overflow-x: auto; }
.nd-table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.nd-table th, .nd-table td {
  border: 1px solid #d1d5db; padding: 4px;
}
.nd-table th { background: #f3f4f6; font-weight: 700; padding: 8px 10px; white-space: nowrap; }
.nd-table .line-num { background: #f9fafb; color: #9ca3af; font-size: .8rem; padding: 4px 8px; text-align: center; width: 36px; }
.nd-table td input, .nd-table td select {
  width: 100%; padding: 7px 8px; border: none; outline: none;
  font-size: .88rem; font-family: monospace; background: transparent;
}
.nd-table td input:focus, .nd-table td select:focus { background: #eff6ff; }
.nd-table .col-ass { width: 130px; }
.nd-table .col-formula { min-width: 200px; }
.nd-table .col-just { min-width: 180px; }
.nd-table .col-del { width: 36px; text-align: center; }
.del-row-btn {
  background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; padding: 2px 6px;
}
.add-row-btn {
  margin-top: 8px; padding: 7px 16px; font-size: .85rem;
  background: #f3f4f6; border: 1.5px dashed #d1d5db; border-radius: 8px; cursor: pointer; color: #6b7280;
}
.add-row-btn:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }

/* ── TRANSLATION ── */
.trans-section { margin-bottom: 20px; }
.trans-section h4 { font-size: .9rem; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
.trans-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
.trans-row input { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: monospace; font-size: .9rem; outline: none; }
.trans-row input:focus { border-color: var(--primary); }
.trans-row .del-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; }
.proof-method-select { display: flex; gap: 10px; margin-bottom: 16px; }
.method-btn {
  flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 8px;
  background: white; cursor: pointer; font-size: .85rem; font-weight: 600;
  transition: all .2s; text-align: center;
}
.method-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

/* ── SUBMIT BAR ── */
.submit-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: white; border-top: 1px solid var(--border);
  padding: 12px 24px; display: flex; justify-content: flex-end; gap: 12px;
  box-shadow: 0 -4px 20px rgba(0,0,0,.08); z-index: 99;
}

/* ── RESULT SCREEN ── */
#result { display: none; max-width: 760px; margin: 40px auto; padding: 0 16px; }
.result-hero {
  background: var(--dark); color: white; border-radius: 16px; padding: 40px;
  text-align: center; margin-bottom: 20px;
}
.result-hero h2 { font-size: 1.8rem; margin-bottom: 8px; }
.result-hero .big-score { font-size: 3.5rem; font-weight: 800; }
.result-hero p { opacity: .75; }
.result-card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
.result-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.grade-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
.grade-row:last-child { border-bottom: none; }
.grade-ok  { color: #16a34a; font-weight: 700; }
.grade-err { color: #dc2626; font-size: .85rem; }
.manual-badge { background: #fef9c3; color: #854d0e; padding: 3px 10px; border-radius: 99px; font-size: .78rem; font-weight: 700; }
</style>
</head>
<body>

<header>
  <h1>🧠 Logic Quiz</h1>
  <div id="timer" style="display:none">⏱ <span id="timer-val">00:00</span></div>
  <div style="display:flex;gap:10px;align-items:center">
    <span id="user-label" style="font-size:.85rem;opacity:.75;"></span>
    <button class="btn btn-secondary" style="padding:7px 16px;font-size:.82rem;" onclick="logout()">Logout</button>
  </div>
</header>

<!-- WAITING -->
<div id="waiting">
  <div class="big">⏳</div>
  <h2>Waiting for quiz to start</h2>
  <p>Your instructor hasn't started the quiz yet. This page polls every 5 seconds — it will update automatically when the quiz begins.</p>
  <p style="margin-top:16px;color:#9ca3af;font-size:.82rem;">Checking for active quiz…</p>
</div>

<!-- QUIZ -->
<div id="quiz">
  <div class="q-nav" id="q-dots"></div>
  <div class="progress-wrap"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div id="question-area"></div>
  <div class="submit-bar">
    <button class="btn btn-secondary" id="btn-prev" onclick="navigate(-1)">← Previous</button>
    <button class="btn btn-secondary" id="btn-next" onclick="navigate(1)">Next →</button>
    <button class="btn btn-primary" id="btn-submit" onclick="confirmSubmit()">Submit Quiz ✓</button>
  </div>
</div>

<!-- RESULT -->
<div id="result">
  <div class="result-hero">
    <h2 id="result-title">Quiz Submitted!</h2>
    <div class="big-score" id="result-score">—</div>
    <p id="result-msg"></p>
  </div>
  <div class="result-card">
    <h3>Question Results</h3>
    <div id="result-detail"></div>
  </div>
  <div style="text-align:center;padding:20px;">
    <button class="btn btn-secondary" onclick="logout()">← Back to Login</button>
  </div>
</div>

<script>
// ════════════════════════════════
//  STATE
// ════════════════════════════════
const TOKEN = localStorage.getItem('lqs_token');
const USER  = JSON.parse(localStorage.getItem('lqs_user') || '{}');
if (!TOKEN) { window.location.href = '/'; }

document.getElementById('user-label').textContent = USER.name || USER.username || '';

let session    = null;
let questions  = [];
let answers    = {};   // qid → answer object
let currentIdx = 0;
let timerInterval = null;
let pollInterval  = null;
let submitted = false;

// ════════════════════════════════
//  SYMBOL INSERTION
// ════════════════════════════════
let lastFocused = null;
document.addEventListener('focusin', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') lastFocused = e.target;
});

function insertSym(s) {
  const el = lastFocused;
  if (!el) return;
  const start = el.selectionStart || 0;
  const end   = el.selectionEnd   || 0;
  el.value = el.value.slice(0, start) + s + el.value.slice(end);
  el.selectionStart = el.selectionEnd = start + s.length;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.focus();
}

const SYM_BAR_HTML = `
<div class="sym-bar">
  <button class="sym-btn" onclick="insertSym('&')"   title="Conjunction">&amp;</button>
  <button class="sym-btn" onclick="insertSym('v')"   title="Disjunction">v</button>
  <button class="sym-btn" onclick="insertSym('-->')" title="Implication">→</button>
  <button class="sym-btn" onclick="insertSym('<->')" title="Biconditional">↔</button>
  <button class="sym-btn" onclick="insertSym('~')"   title="Negation">~</button>
  <button class="sym-btn" onclick="insertSym('Ax')"  title="Universal ∀x">∀x</button>
  <button class="sym-btn" onclick="insertSym('Ex')"  title="Existential ∃x">∃x</button>
  <button class="sym-btn" onclick="insertSym('(')"   title="Left bracket">(</button>
  <button class="sym-btn" onclick="insertSym(')')"   title="Right bracket">)</button>
  <button class="sym-btn" onclick="insertSym('F')"   title="Bottom ⊥">⊥</button>
</div>`;

// ════════════════════════════════
//  API HELPERS
// ════════════════════════════════
async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { logout(); return null; }
  return res.json();
}

// ════════════════════════════════
//  POLLING FOR ACTIVE SESSION
// ════════════════════════════════
async function pollSession() {
  const s = await api('GET', '/api/active-session');
  if (!s) return;  // not started yet

  clearInterval(pollInterval);
  session = s;

  // Fetch questions
  const allQ = await api('GET', '/api/questions');
  if (!allQ) return;
  const ids = s.question_ids.map(String);
  questions = ids.map(id => allQ.find(q => String(q.id) === id)).filter(Boolean);

  if (questions.length === 0) {
    document.getElementById('waiting').querySelector('h2').textContent = 'No questions assigned.';
    return;
  }

  // Initialize answers
  questions.forEach(q => { if (!answers[q.id]) answers[q.id] = makeDefaultAnswer(q); });

  document.getElementById('waiting').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('timer').style.display = 'flex';

  buildDots();
  renderQuestion(0);
  startTimer();

  // Poll for session end
  pollInterval = setInterval(checkSessionEnd, 10000);
}

async function checkSessionEnd() {
  const s = await api('GET', '/api/active-session');
  if (!s && !submitted) {
    clearInterval(pollInterval);
    alert('Time is up! Your answers will be submitted now.');
    await submitQuiz();
  }
}

// ════════════════════════════════
//  TIMER
// ════════════════════════════════
function startTimer() {
  const endTime = session.end_time;
  const timerEl = document.getElementById('timer');
  const valEl   = document.getElementById('timer-val');

  function tick() {
    const left = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
    const m = Math.floor(left / 60), s = left % 60;
    valEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (left <= 300) timerEl.classList.add('warn'); else timerEl.classList.remove('warn');
    if (left <= 0 && !submitted) {
      clearInterval(timerInterval);
      clearInterval(pollInterval);
      submitQuiz();
    }
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

// ════════════════════════════════
//  NAVIGATION
// ════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('q-dots');
  wrap.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'q-dot';
    d.id = `dot-${i}`;
    d.textContent = i + 1;
    d.onclick = () => { saveCurrentAnswer(); renderQuestion(i); };
    wrap.appendChild(d);
  });
}

function updateDots() {
  questions.forEach((q, i) => {
    const d = document.getElementById(`dot-${i}`);
    if (!d) return;
    d.className = 'q-dot' + (isAnswered(q.id) ? ' answered' : '') + (i === currentIdx ? ' active' : '');
  });
  document.getElementById('progress').style.width = `${(currentIdx + 1) / questions.length * 100}%`;
}

function navigate(dir) {
  saveCurrentAnswer();
  const next = currentIdx + dir;
  if (next < 0 || next >= questions.length) return;
  renderQuestion(next);
}

function isAnswered(qid) {
  const a = answers[qid];
  if (!a) return false;
  if (a.type === 'truth_table') return a.method === 'shortcut' || (a.table && a.table.flat().some(v => v !== ''));
  if (a.type === 'natural_deduction' || a.type === 'predicate_logic') return (a.steps || []).some(s => s.formula.trim() !== '');
  if (a.type === 'translation') return (a.premises || []).some(p => p.trim() !== '') || (a.conclusion || '').trim() !== '';
  return false;
}

// ════════════════════════════════
//  RENDER QUESTION
// ════════════════════════════════
function renderQuestion(idx) {
  currentIdx = idx;
  updateDots();
  const q   = questions[idx];
  const area = document.getElementById('question-area');
  const typeLabels = { truth_table:'Truth Table', natural_deduction:'Natural Deduction', predicate_logic:'Predicate Logic', translation:'Translation' };
  const typeCls    = { truth_table:'type-tt', natural_deduction:'type-nd', predicate_logic:'type-pl', translation:'type-tr' };

  let html = `<div class="question-card">
    <div class="q-header">
      <span class="q-num">Question ${idx + 1} of ${questions.length} &nbsp;·&nbsp; ${q.points || 10} pts</span>
      <span class="q-type ${typeCls[q.type] || ''}">${typeLabels[q.type] || q.type}</span>
    </div>
    <div class="q-text">${escHtml(q.question_text)}</div>`;

  if (q.type === 'truth_table')         html += renderTruthTable(q);
  else if (q.type === 'natural_deduction' || q.type === 'predicate_logic') html += renderND(q);
  else if (q.type === 'translation')    html += renderTranslation(q);

  html += '</div>';
  area.innerHTML = html;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').style.display = idx === questions.length - 1 ? 'none' : '';
}

// ─── Truth Table ───
function renderTruthTable(q) {
  const meta   = q.metadata || {};
  const cols   = meta.columns || [];
  const nRows  = meta.sample_answer ? meta.sample_answer.length : Math.pow(2, cols.filter(c => /^[A-Z]$/.test(c)).length);
  const ans    = answers[q.id] || makeDefaultAnswer(q);
  const nVars  = cols.filter(c => /^[A-Z]$/.test(c)).length;
  const allowShortcut = meta.allow_shortcut;

  let html = '';

  if (allowShortcut) {
    const method = ans.method || 'full';
    html += `<div style="margin-bottom:14px;display:flex;gap:10px;">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="radio" name="tt-method-${q.id}" value="full" ${method === 'full' ? 'checked' : ''} onchange="setTTMethod('${q.id}','full')"> Full truth table
      </label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="radio" name="tt-method-${q.id}" value="shortcut" ${method === 'shortcut' ? 'checked' : ''} onchange="setTTMethod('${q.id}','shortcut')"> Shortcut method
      </label>
    </div>`;
  }

  if ((ans.method || 'full') === 'shortcut' && allowShortcut) {
    // 2-row × 30-column table
    html += `<p style="color:#6b7280;font-size:.85rem;margin-bottom:10px;">Enter T/F (or 1/0) in each cell. Row 1: assignment. Row 2: evaluation.</p>
    <div style="overflow-x:auto;"><table class="shortcut-table">`;
    for (let r = 0; r < 2; r++) {
      html += `<tr><td class="row-label">${r === 0 ? 'Row 1 (Assignment)' : 'Row 2 (Evaluation)'}</td>`;
      for (let c = 0; c < 30; c++) {
        const val = (ans.shortcut || [])[r]?.[c] || '';
        html += `<td><input type="text" maxlength="1" value="${escHtml(val)}" data-row="${r}" data-col="${c}"
          oninput="setShortcutCell('${q.id}',${r},${c},this.value)" onkeydown="shortcutNav(event,${r},${c},${q.id})"></td>`;
      }
      html += '</tr>';
    }
    html += '</table></div>';
  } else {
    // Full truth table
    html += `${SYM_BAR_HTML}<div style="overflow-x:auto;"><table class="tt-table">
      <thead><tr><th>#</th>`;
    cols.forEach(c => { html += `<th>${escHtml(c)}</th>`; });
    html += '</tr></thead><tbody>';

    // Generate standard truth assignments for variable columns
    const varCols = cols.filter(c => /^[A-Z]$/.test(c));
    const totalRows = nRows;
    const table = ans.table || Array.from({ length: totalRows }, () => Array(cols.length).fill(''));
    for (let r = 0; r < totalRows; r++) {
      html += `<tr><td style="background:#f9fafb;color:#9ca3af;font-size:.8rem;padding:4px 8px;">${r + 1}</td>`;
      cols.forEach((col, ci) => {
        const isVar = /^[A-Z]$/.test(col);
        const val   = table[r]?.[ci] || '';
        if (isVar) {
          // Auto-fill variable columns
          const varIdx = varCols.indexOf(col);
          const period = totalRows / Math.pow(2, varIdx + 1);
          const autoVal = Math.floor(r / period) % 2 === 0 ? 'T' : 'F';
          html += `<td class="given-col"><input type="text" value="${autoVal}" readonly style="color:#9ca3af;cursor:default;" data-row="${r}" data-col="${ci}"></td>`;
        } else {
          html += `<td><input type="text" maxlength="1" value="${escHtml(val)}" placeholder="T/F"
            data-row="${r}" data-col="${ci}"
            oninput="setTTCell('${q.id}',${r},${ci},this.value)"></td>`;
        }
      });
      html += '</tr>';
    }
    html += '</tbody></table></div>';
  }
  return html;
}

// ─── Natural Deduction / Predicate Logic ───
function renderND(q) {
  const meta  = q.metadata || {};
  const steps = (answers[q.id] || makeDefaultAnswer(q)).steps || [];
  const rules = (meta.allowed_rules || []);
  const premText = (meta.premises || []).join(';  ');
  const concText = meta.conclusion || '';

  let html = `
  <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:14px;margin-bottom:16px;font-family:monospace;font-size:.9rem;">
    <strong>Premises:</strong> ${escHtml(premText) || '<em>none</em>'}<br>
    <strong>Conclusion:</strong> ${escHtml(concText)}
  </div>
  ${SYM_BAR_HTML}
  <p style="color:#6b7280;font-size:.83rem;margin-bottom:10px;">
    Col 1: Open assumption line numbers (comma-separated).
    Col 2: Derived formula.
    Col 3: Rule / theorem used and line numbers cited (e.g. <code>→E 1, 2</code>).
  </p>
  <div class="nd-wrap"><table class="nd-table" id="nd-tbl-${q.id}">
    <thead><tr>
      <th class="line-num">#</th>
      <th class="col-ass">Assumptions (lines)</th>
      <th class="col-formula">Formula</th>
      <th class="col-just">Justification</th>
      <th class="col-del"></th>
    </tr></thead>
    <tbody id="nd-body-${q.id}">`;

  if (steps.length === 0) steps.push({ assumptionNums: '', formula: '', justification: 'Prem' });

  steps.forEach((s, i) => {
    html += ndRow(q.id, i, s);
  });

  html += `</tbody></table></div>
  <button class="add-row-btn" onclick="addNDRow('${q.id}')">+ Add row</button>`;
  return html;
}

function ndRow(qid, idx, s) {
  return `<tr id="nd-row-${qid}-${idx}">
    <td class="line-num">${idx + 1}</td>
    <td class="col-ass"><input type="text" value="${escHtml(s.assumptionNums || '')}" placeholder="e.g. 1,3"
      oninput="setNDCell('${qid}',${idx},'assumptionNums',this.value)"></td>
    <td class="col-formula"><input type="text" value="${escHtml(s.formula || '')}" placeholder="formula"
      oninput="setNDCell('${qid}',${idx},'formula',this.value)"></td>
    <td class="col-just"><input type="text" value="${escHtml(s.justification || '')}" placeholder="e.g. →E 1,2"
      oninput="setNDCell('${qid}',${idx},'justification',this.value)"></td>
    <td class="col-del"><button class="del-row-btn" onclick="delNDRow('${qid}',${idx})" title="Delete row">✕</button></td>
  </tr>`;
}

// ─── Translation ───
function renderTranslation(q) {
  const meta   = q.metadata || {};
  const ans    = answers[q.id] || makeDefaultAnswer(q);
  const prems  = ans.premises || [''];
  const conc   = ans.conclusion || '';
  const method = ans.proofType || 'nd';

  let html = `
  <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:14px;margin-bottom:16px;font-size:.9rem;">
    <strong>Instructions:</strong> ${escHtml(meta.instructions || 'Translate the argument into symbolic form, then verify its validity.')}
  </div>
  <div class="trans-section">
    <h4>Premises (one per line)</h4>
    ${SYM_BAR_HTML}
    <div id="trans-prems-${q.id}">`;
  prems.forEach((p, i) => {
    html += `<div class="trans-row" id="tprem-${q.id}-${i}">
      <span style="min-width:20px;color:#9ca3af;font-size:.82rem;">${i + 1}.</span>
      <input type="text" value="${escHtml(p)}" placeholder="e.g. Ax(Px --> Qx)"
        oninput="setTransPrem('${q.id}',${i},this.value)">
      <button class="del-btn" onclick="delTransPrem('${q.id}',${i})">✕</button>
    </div>`;
  });
  html += `</div>
    <button class="add-row-btn" onclick="addTransPrem('${q.id}')">+ Add premise</button>
  </div>
  <div class="trans-section">
    <h4>Conclusion</h4>
    <div class="trans-row">
      <input type="text" id="trans-conc-${q.id}" value="${escHtml(conc)}" placeholder="e.g. Qa"
        oninput="setTransConc('${q.id}',this.value)">
    </div>
  </div>
  <div class="trans-section">
    <h4>Verification Method</h4>
    <div class="proof-method-select">
      <div class="method-btn ${method === 'nd' ? 'active' : ''}" onclick="setProofMethod('${q.id}','nd')">Natural Deduction</div>
      <div class="method-btn ${method === 'pl' ? 'active' : ''}" onclick="setProofMethod('${q.id}','pl')">Predicate Logic</div>
      <div class="method-btn ${method === 'tt' ? 'active' : ''}" onclick="setProofMethod('${q.id}','tt')">Truth Table</div>
    </div>
    <div id="trans-proof-${q.id}">`;
  html += renderTransProof(q, ans);
  html += `</div></div>`;
  return html;
}

function renderTransProof(q, ans) {
  const method = ans.proofType || 'nd';
  if (method === 'tt') {
    const meta = q.metadata || {};
    const tCols = (ans.premises || []).concat([ans.conclusion]).filter(Boolean);
    return `<p style="color:#6b7280;font-size:.85rem;">Truth table columns will correspond to your premises and conclusion above.</p>
    <p style="color:#f59e0b;font-size:.85rem;margin-top:6px;">ℹ Provide the full truth table rows in the ND proof area or submit — the instructor will review manually.</p>`;
  }
  // ND / PL
  const steps = ans.ndProof || [];
  let html = `${SYM_BAR_HTML}<div class="nd-wrap"><table class="nd-table" id="tnd-tbl-${q.id}">
    <thead><tr>
      <th class="line-num">#</th>
      <th class="col-ass">Assumptions</th>
      <th class="col-formula">Formula</th>
      <th class="col-just">Justification</th>
      <th class="col-del"></th>
    </tr></thead>
    <tbody id="tnd-body-${q.id}">`;
  const displaySteps = steps.length > 0 ? steps : [{ assumptionNums: '', formula: '', justification: 'Prem' }];
  displaySteps.forEach((s, i) => { html += transNDRow(q.id, i, s); });
  html += `</tbody></table></div>
  <button class="add-row-btn" onclick="addTransNDRow('${q.id}')">+ Add row</button>`;
  return html;
}

function transNDRow(qid, idx, s) {
  return `<tr id="tnd-row-${qid}-${idx}">
    <td class="line-num">${idx + 1}</td>
    <td class="col-ass"><input type="text" value="${escHtml(s.assumptionNums || '')}"
      oninput="setTransNDCell('${qid}',${idx},'assumptionNums',this.value)"></td>
    <td class="col-formula"><input type="text" value="${escHtml(s.formula || '')}" placeholder="formula"
      oninput="setTransNDCell('${qid}',${idx},'formula',this.value)"></td>
    <td class="col-just"><input type="text" value="${escHtml(s.justification || '')}" placeholder="e.g. →E 1,2"
      oninput="setTransNDCell('${qid}',${idx},'justification',this.value)"></td>
    <td class="col-del"><button class="del-row-btn" onclick="delTransNDRow('${qid}',${idx})">✕</button></td>
  </tr>`;
}

// ════════════════════════════════
//  ANSWER MUTATION HELPERS
// ════════════════════════════════
function makeDefaultAnswer(q) {
  if (q.type === 'truth_table') {
    const meta = q.metadata || {};
    const cols = meta.columns || [];
    const nRows = meta.sample_answer ? meta.sample_answer.length : Math.pow(2, cols.filter(c => /^[A-Z]$/.test(c)).length);
    return { type: q.type, method: 'full', table: Array.from({ length: nRows }, () => Array(cols.length).fill('')) };
  }
  if (q.type === 'natural_deduction' || q.type === 'predicate_logic') {
    return { type: q.type, steps: [] };
  }
  if (q.type === 'translation') {
    return { type: q.type, premises: [''], conclusion: '', proofType: 'nd', ndProof: [] };
  }
  return { type: q.type };
}

function ensureAnswer(qid, q) {
  if (!answers[qid]) answers[qid] = makeDefaultAnswer(q);
  return answers[qid];
}

function setTTMethod(qid, method) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  a.method = method;
  saveCurrentAnswer();
  renderQuestion(currentIdx);
}

function setTTCell(qid, r, c, val) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  if (!a.table[r]) a.table[r] = [];
  a.table[r][c] = val.toUpperCase();
}

function setShortcutCell(qid, r, c, val) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  if (!a.shortcut) a.shortcut = [Array(30).fill(''), Array(30).fill('')];
  a.shortcut[r][c] = val.toUpperCase();
}

function shortcutNav(e, r, c, qid) {
  if (e.key === 'Tab' || e.key === 'ArrowRight') {
    e.preventDefault();
    const next = document.querySelector(`[data-row="${r}"][data-col="${c + 1}"]`);
    if (next) next.focus();
  }
}

function setNDCell(qid, idx, field, val) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  if (!a.steps[idx]) a.steps[idx] = { assumptionNums: '', formula: '', justification: '' };
  a.steps[idx][field] = val;
  // Renumber line display
  document.querySelectorAll(`#nd-body-${qid} tr`).forEach((tr, i) => {
    const lineCell = tr.querySelector('.line-num');
    if (lineCell) lineCell.textContent = i + 1;
  });
}

function addNDRow(qid) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  const idx = a.steps.length;
  a.steps.push({ assumptionNums: '', formula: '', justification: '' });
  const tbody = document.getElementById(`nd-body-${qid}`);
  const tr = document.createElement('tr');
  tr.id = `nd-row-${qid}-${idx}`;
  tr.innerHTML = ndRow(qid, idx, { assumptionNums: '', formula: '', justification: '' }).replace(/^<tr[^>]*>/, '').replace(/<\/tr>$/, '');
  tbody.appendChild(tr);
  tr.querySelector('input[placeholder="formula"]').focus();
}

function delNDRow(qid, idx) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  a.steps.splice(idx, 1);
  renderQuestion(currentIdx);
}

function setTransPrem(qid, idx, val) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  a.premises[idx] = val;
}
function addTransPrem(qid) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  a.premises.push('');
  renderQuestion(currentIdx);
}
function delTransPrem(qid, idx) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  a.premises.splice(idx, 1);
  renderQuestion(currentIdx);
}
function setTransConc(qid, val) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  a.conclusion = val;
}
function setProofMethod(qid, method) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  a.proofType = method;
  renderQuestion(currentIdx);
}
function setTransNDCell(qid, idx, field, val) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  if (!a.ndProof) a.ndProof = [];
  if (!a.ndProof[idx]) a.ndProof[idx] = { assumptionNums: '', formula: '', justification: '' };
  a.ndProof[idx][field] = val;
}
function addTransNDRow(qid) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  if (!a.ndProof) a.ndProof = [];
  const idx = a.ndProof.length;
  a.ndProof.push({ assumptionNums: '', formula: '', justification: '' });
  const tbody = document.getElementById(`tnd-body-${qid}`);
  if (!tbody) return;
  const tr = document.createElement('tr');
  tr.id = `tnd-row-${qid}-${idx}`;
  tr.innerHTML = transNDRow(qid, idx, { assumptionNums: '', formula: '', justification: '' }).replace(/^<tr[^>]*>/, '').replace(/<\/tr>$/, '');
  tbody.appendChild(tr);
}
function delTransNDRow(qid, idx) {
  const q = questions.find(x => String(x.id) === String(qid));
  const a = ensureAnswer(qid, q);
  if (a.ndProof) a.ndProof.splice(idx, 1);
  renderQuestion(currentIdx);
}

function saveCurrentAnswer() { /* answers are mutated in-place */ }

// ════════════════════════════════
//  SUBMIT
// ════════════════════════════════
async function confirmSubmit() {
  const unanswered = questions.filter(q => !isAnswered(q.id)).length;
  const msg = unanswered > 0
    ? `You have ${unanswered} unanswered question(s). Submit anyway?`
    : 'Submit your quiz? You cannot change your answers after submission.';
  if (!confirm(msg)) return;
  await submitQuiz();
}

async function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);
  clearInterval(pollInterval);

  document.getElementById('btn-submit').disabled = true;
  document.getElementById('btn-submit').textContent = 'Submitting…';

  const res = await api('POST', '/api/submissions', { session_id: session.id, answers });
  if (!res) return;

  showResults(res);
}

function showResults(res) {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('timer').style.display = 'none';
  document.getElementById('result').style.display = 'block';

  const ga = res.gradedAnswers || {};
  let totalEarned = 0, totalPossible = 0;
  let detailHtml = '';

  questions.forEach((q, i) => {
    const g = ga[q.id] || {};
    const pts = q.points || 10;
    totalPossible += pts;
    const score = g.score != null ? g.score : 0;
    if (g.score != null && !g.needsManualGrading) totalEarned += score;

    const icon = g.needsManualGrading ? '📋' : (g.ok ? '✅' : '❌');
    detailHtml += `<div class="grade-row">
      <span><strong>${i + 1}. ${escHtml(q.title || q.question_text.slice(0, 60))}…</strong></span>
      <span>
        ${g.needsManualGrading ? '<span class="manual-badge">Manual Review</span>' :
          `<span class="${g.ok ? 'grade-ok' : 'grade-err'}">${icon} ${(score || 0).toFixed(1)} / ${pts}</span>`}
      </span>
    </div>`;
    if (g.errors && g.errors.length) {
      detailHtml += `<div style="margin:0 0 8px 16px;font-size:.82rem;color:#dc2626;">${g.errors.slice(0, 3).map(e => escHtml(String(e))).join('<br>')}</div>`;
    }
    if (g.feedback && g.feedback.length) {
      detailHtml += `<div style="margin:0 0 8px 16px;font-size:.82rem;color:#6b7280;">${g.feedback.map(f => escHtml(f)).join(' ')}</div>`;
    }
  });

  const pct = totalPossible > 0 ? Math.round(totalEarned / totalPossible * 100) : 0;
  document.getElementById('result-score').textContent = `${totalEarned.toFixed(1)} / ${totalPossible}`;
  document.getElementById('result-msg').textContent   = `${pct}% — ${pct >= 90 ? 'Excellent!' : pct >= 70 ? 'Good work!' : pct >= 50 ? 'Keep practising.' : 'Review the material and try again.'}`;
  document.getElementById('result-detail').innerHTML  = detailHtml;
}

// ════════════════════════════════
//  UTILS
// ════════════════════════════════
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function logout() {
  localStorage.removeItem('lqs_token');
  localStorage.removeItem('lqs_user');
  window.location.href = '/';
}

// ════════════════════════════════
//  INIT
// ════════════════════════════════
pollSession();
pollInterval = setInterval(pollSession, 5000);
</script>
